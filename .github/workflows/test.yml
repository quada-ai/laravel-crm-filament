name: Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
        filament: ['4.*', '5.*']

    name: PHP ${{ matrix.php }} / Filament ${{ matrix.filament }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath, intl, gd
          coverage: none
          tools: composer:v2

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ matrix.php }}-filament-${{ matrix.filament }}-${{ hashFiles('**/composer.json') }}
          restore-keys: composer-${{ matrix.php }}-filament-${{ matrix.filament }}-

      - name: Pin Filament version
        run: composer require "filament/filament:${{ matrix.filament }}" "filament/forms:${{ matrix.filament }}" "filament/tables:${{ matrix.filament }}" --no-update --no-interaction

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress --with-all-dependencies

      - name: Run Pest
        run: ./vendor/bin/pest --no-coverage
